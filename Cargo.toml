[package]
name = "bili-web-android-stream-helper"
version = "0.1.5"
edition = "2021"
description = "Native Messaging helper boundary for BiliWebAndroidStream"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "json"] }
md-5 = "0.10"
qrcode = "0.14"

[dev-dependencies]
serde_json = "1.0"
