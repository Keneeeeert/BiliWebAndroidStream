name: Build and publish helper

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: biliwebandroidstream-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            archive: biliwebandroidstream-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            archive: biliwebandroidstream-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: biliwebandroidstream-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build helper
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix helper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="${{ matrix.archive }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/bili-web-android-stream-helper" "$out/"
          cp scripts/install-native-host.sh scripts/uninstall-native-host.sh "$out/"
          cp docs/helper-install.md "$out/"
          chmod +x "$out"/*.sh
          tar -czf "$out.tar.gz" "$out"
      - name: Package Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "${{ matrix.archive }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\bili-web-android-stream-helper.exe" "$out\"
          Copy-Item scripts\install-native-host.ps1, scripts\uninstall-native-host.ps1, docs\helper-install.md "$out\"
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Package Firefox extension
        run: (cd extension && zip -qr ../release/BiliWebAndroidStream-firefox.zip .)
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
