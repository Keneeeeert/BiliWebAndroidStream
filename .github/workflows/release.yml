name: Build and publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  extension:
    name: extension firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Firefox extension
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("extension/manifest.json"))["version"])')"
          out="BiliWebAndroidStream-firefox-v${version}"
          (cd extension && zip -qr "../${out}.zip" .)
          echo "zip=${out}.zip" >> "$GITHUB_ENV"
      - name: Validate JS syntax
        run: |
          set -euo pipefail
          for f in extension/src/*.js extension/src/lib/*.js extension/options/*.js; do
            node --check "$f"
          done
          python3 -m json.tool extension/manifest.json > /dev/null
      - name: Verify extension version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("extension/manifest.json"))["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "extension manifest version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BiliWebAndroidStream-firefox
          path: ${{ env.zip }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
