name: Build and publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  extension:
    name: extension firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Firefox extension
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("extension/manifest.json"))["version"])')"
          out="BiliWebAndroidStream-firefox-v${version}"
          (cd extension && zip -qr "../${out}.zip" .)
          echo "zip=${out}.zip" >> "$GITHUB_ENV"
      - name: Validate JS syntax
        run: |
          set -euo pipefail
          for f in extension/src/*.js extension/src/lib/*.js extension/options/*.js; do
            node --check "$f"
          done
          python3 -m json.tool extension/manifest.json > /dev/null
      - name: Verify extension version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("extension/manifest.json"))["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "extension manifest version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BiliWebAndroidStream-firefox
          path: ${{ env.zip }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  publish-amo:
    # Uploads the same zip as a new version on addons.mozilla.org (listed
    # channel). Needs repo secrets AMO_API_KEY / AMO_API_SECRET from
    # https://addons.mozilla.org/developers/addon/api/key/
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Upload to AMO
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          # Listed versions require a license slug; defaults to the repo's MIT.
          AMO_LICENSE: ${{ vars.AMO_LICENSE || 'MIT' }}
        run: |
          set -euo pipefail
          test -n "${AMO_API_KEY:?set the AMO_API_KEY repo secret}" 
          test -n "${AMO_API_SECRET:?set the AMO_API_SECRET repo secret}"
          zip="$(ls release/*.zip)"
          # AMO expects an HS256 JWT issued from the API key pair.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          jti="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          header="$(printf '{"alg":"HS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iss":"%s","jti":"%s","iat":%s,"exp":%s}' \
            "$AMO_API_KEY" "$jti" "$now" "$((now + 300))" | b64url)"
          sig="$(printf '%s.%s' "$header" "$payload" \
            | openssl dgst -sha256 -hmac "$AMO_API_SECRET" -binary | b64url)"
          auth="Authorization: JWT ${header}.${payload}.${sig}"
          base="https://addons.mozilla.org/api/v5"
          # Two-step upload per the AMO v5 API: POST the file to
          # /addons/upload/ (with its channel), poll the upload until the
          # validator has processed it, then attach the upload UUID to the
          # addon as a new version.
          curl -sS -H "$auth" -F "upload=@${zip}" -F "channel=listed" \
            "$base/addons/upload/" > /tmp/amo-upload.json
          uuid="$(python3 -c 'import json; d=json.load(open("/tmp/amo-upload.json")); print(d.get("uuid") if isinstance(d, dict) else "")')"
          if [ -z "$uuid" ]; then
            echo "AMO upload rejected:"; cat /tmp/amo-upload.json; exit 1
          fi
          valid=""
          for _ in $(seq 1 60); do
            curl -sS -H "$auth" "$base/addons/upload/${uuid}/" > /tmp/amo-upload.json
            valid="$(python3 -c 'import json; d=json.load(open("/tmp/amo-upload.json")); print(d.get("valid") if d.get("processed") else "")')"
            [ -n "$valid" ] && break
            sleep 2
          done
          cat /tmp/amo-upload.json
          if [ "$valid" != "True" ]; then
            echo "AMO validation failed for ${zip}" >&2
            exit 1
          fi
          # Listed versions require add-on metadata (categories) to be set.
          patch_status="$(curl -sS -o /tmp/amo-addon.json -w '%{http_code}' \
            -H "$auth" \
            -H "Content-Type: application/json" \
            -X PATCH \
            -d '{"categories":{"firefox":["other"],"android":["other"]}}' \
            "$base/addons/addon/biliwebandroidstream%40example.invalid/")"
          cat /tmp/amo-addon.json
          if [ "$patch_status" -ge 400 ]; then
            echo "AMO metadata update failed with HTTP $patch_status" >&2
            exit 1
          fi
          status="$(curl -sS -o /tmp/amo-response.json -w '%{http_code}' \
            -H "$auth" \
            -H "Content-Type: application/json" \
            -d "{\"upload\":\"${uuid}\",\"license\":\"${AMO_LICENSE}\"}" \
            "$base/addons/addon/biliwebandroidstream%40example.invalid/versions/")"
          cat /tmp/amo-response.json
          if [ "$status" != 201 ] && [ "$status" != 202 ]; then
            echo "AMO upload failed with HTTP $status" >&2
            exit 1
          fi
