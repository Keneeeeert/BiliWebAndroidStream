name: Build and publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  extension:
    name: extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extensions (Firefox + Chrome)
        run: |
          set -euo pipefail
          scripts/build.sh
          ls -la dist/
      - name: Validate JS syntax
        run: |
          set -euo pipefail
          for f in extension/src/*.js extension/src/lib/*.js extension/options/*.js; do
            node --check "$f"
          done
          python3 -m json.tool extension/manifest.json > /dev/null
          python3 -m json.tool extension/manifest.chrome.json > /dev/null
      - name: Verify extension version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("extension/manifest.json"))["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "extension manifest version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BiliWebAndroidStream
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - name: Build release notes
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")"
          {
            echo "Changes since ${prev}:"
            git log --format='- %s (%h)' "${prev}..${GITHUB_REF_NAME}"
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
          } > release-notes.md
          cat release-notes.md
      # A deterministic body (computed above) is passed explicitly so that
      # re-running the workflow for the same tag replaces, not appends.
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release/*

  publish-amo:
    # Uploads the same package as a new UNLISTED version on
    # addons.mozilla.org: auto-signed, never appears in the store directory.
    # Needs repo secrets AMO_API_KEY / AMO_API_SECRET from
    # https://addons.mozilla.org/developers/addon/api/key/
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Upload to AMO
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          # Unlisted versions still require a license slug; MIT per LICENSE.
          AMO_LICENSE: ${{ vars.AMO_LICENSE || 'MIT' }}
        run: |
          set -euo pipefail
          test -n "${AMO_API_KEY:?set the AMO_API_KEY repo secret}" 
          test -n "${AMO_API_SECRET:?set the AMO_API_SECRET repo secret}"
          # Only the Firefox package goes to AMO; the Chrome build has no
          # store presence and is distributed via GitHub Releases.
          # Only the Firefox package goes to AMO; the Chrome build has no
          # store presence and is distributed via GitHub Releases.
          pkg="$(ls release/BiliWebAndroidStream-firefox-v*-unsigned.zip)"
          # AMO expects an HS256 JWT issued from the API key pair.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          jti="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          header="$(printf '{"alg":"HS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iss":"%s","jti":"%s","iat":%s,"exp":%s}' \
            "$AMO_API_KEY" "$jti" "$now" "$((now + 300))" | b64url)"
          sig="$(printf '%s.%s' "$header" "$payload" \
            | openssl dgst -sha256 -hmac "$AMO_API_SECRET" -binary | b64url)"
          auth="Authorization: JWT ${header}.${payload}.${sig}"
          base="https://addons.mozilla.org/api/v5"
          # Two-step upload per the AMO v5 API: POST the file to
          # /addons/upload/ (with its channel), poll the upload until the
          # validator has processed it, then attach the upload UUID to the
          # addon as a new version.
          curl -sS -H "$auth" -F "upload=@${pkg}" -F "channel=unlisted" \
            "$base/addons/upload/" > /tmp/amo-upload.json
          uuid="$(python3 -c 'import json; d=json.load(open("/tmp/amo-upload.json")); print(d.get("uuid") if isinstance(d, dict) else "")')"
          if [ -z "$uuid" ]; then
            echo "AMO upload rejected:"; cat /tmp/amo-upload.json; exit 1
          fi
          valid=""
          for _ in $(seq 1 60); do
            curl -sS -H "$auth" "$base/addons/upload/${uuid}/" > /tmp/amo-upload.json
            valid="$(python3 -c 'import json; d=json.load(open("/tmp/amo-upload.json")); print(d.get("valid") if d.get("processed") else "")')"
            [ -n "$valid" ] && break
            sleep 2
          done
          cat /tmp/amo-upload.json
          if [ "$valid" != "True" ]; then
            echo "AMO validation failed for ${pkg}" >&2
            exit 1
          fi
          # Version create still requires add-on metadata to be set; keep the
          # store summary in sync with the manifest description.
          patch_status="$(curl -sS -o /tmp/amo-addon.json -w '%{http_code}' \
            -H "$auth" \
            -H "Content-Type: application/json" \
            -X PATCH \
            -d '{"categories":{"firefox":["other"],"android":["other"]},"summary":"Play Bilibili web videos through the Bilibili Android DASH pipeline."}' \
            "$base/addons/addon/biliwebandroidstream%40example.invalid/")"
          cat /tmp/amo-addon.json
          if [ "$patch_status" -ge 400 ]; then
            echo "AMO metadata update failed with HTTP $patch_status" >&2
            exit 1
          fi
          status="$(curl -sS -o /tmp/amo-response.json -w '%{http_code}' \
            -H "$auth" \
            -H "Content-Type: application/json" \
            -d "{\"upload\":\"${uuid}\",\"license\":\"${AMO_LICENSE}\"}" \
            "$base/addons/addon/biliwebandroidstream%40example.invalid/versions/")"
          cat /tmp/amo-response.json
          # 409 with "already exists" means a previous run of this tag
          # already published the version; treat that as success.
          if [ "$status" = 409 ] && grep -q "already exists" /tmp/amo-response.json; then
            echo "version already on AMO, nothing to do"
            exit 0
          fi
          if [ "$status" != 201 ] && [ "$status" != 202 ]; then
            echo "AMO upload failed with HTTP $status" >&2
            exit 1
          fi
